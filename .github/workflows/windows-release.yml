name: Build deck plugins and Windows macro package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build three downloads
        shell: pwsh
        run: ./build.ps1
      - name: Verify release packages
        run: python tools/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: ag03toggle-windows-x64
          path: |
            dist/com.ju5tv.ag03mk2.streamDeckPlugin
            dist/com.ulanzi.ulanzistudio.ag03toggle.ulanziPlugin.zip
            dist/AG03Toggle-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ag03toggle-windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(dist/com.ju5tv.ag03mk2.streamDeckPlugin
                 dist/com.ulanzi.ulanzistudio.ag03toggle.ulanziPlugin.zip
                 dist/AG03Toggle-Windows-x64.zip)
          # A re-pushed tag refreshes the existing release's files instead of failing.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
